<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03060d">
<meta name="description" content="可交互的 3D 太阳系：太阳与八大行星，点击星球切换视角，支持拖动旋转、滚轮缩放与移动端。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='12' fill='%23ffc447'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%235aa9e6'/%3E%3Ccircle cx='12' cy='32' r='3' fill='%23e08a5a'/%3E%3C/svg%3E">
<title>太阳系 · Solar System</title>
<style>
  :root{
    --glass-bg: rgba(10,16,30,.44);
    --glass-bd: rgba(255,255,255,.14);
    --ink: #e8eefc;
    --ink-dim: #93a4c4;
    --accent: #57b6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#03060d}
  body{
    font:14px/1.5 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    user-select:none;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gl.dragging{cursor:grabbing}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}

  .glass{
    background:var(--glass-bg);
    border:1px solid var(--glass-bd);
    border-radius:16px;
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
  }

  /* ---------- 标题 ---------- */
  #title{
    position:fixed;left:20px;top:20px;padding:12px 18px 13px;
    pointer-events:none;max-width:min(560px, calc(100vw - 40px));
    opacity:0;transform:translateY(-8px);
    transition:opacity .7s ease .15s, transform .7s ease .15s;
  }
  #title.on{opacity:1;transform:none}
  #title h1{
    margin:0;font-size:17px;font-weight:600;letter-spacing:.5px;
    transition:opacity .2s ease;
  }
  #title p{margin:3px 0 0;font-size:12px;color:var(--ink-dim);letter-spacing:.3px;
           font-variant-numeric:tabular-nums;}

  /* ---------- 工具栏 ---------- */
  #toolbar{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
    display:flex;align-items:center;gap:6px;padding:7px;
    opacity:0;transition:opacity .7s ease .3s, transform .7s ease .3s;
    z-index:5;max-width:calc(100vw - 24px);
  }
  #toolbar.on{opacity:1;transform:translate(-50%,0)}

  .pills{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{
    appearance:none;border:0;background:transparent;color:var(--ink-dim);
    font:inherit;font-size:12px;line-height:1;padding:8px 10px;border-radius:8px;
    cursor:pointer;white-space:nowrap;flex:none;
    transition:background .18s,color .18s;
  }
  .pill:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  .pill.active{background:rgba(87,182,255,.22);color:#d3ebff}

  .btn{
    appearance:none;border:0;background:transparent;color:var(--ink-dim);
    font:inherit;font-size:12.5px;line-height:1;
    padding:9px 12px;border-radius:11px;cursor:pointer;
    display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none;
    transition:background .18s,color .18s,transform .12s;
  }
  .btn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .btn:active{transform:scale(.96)}
  .btn svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;
           stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn[aria-pressed="true"]{background:rgba(87,182,255,.17);color:#bfe0ff}
  .btn[aria-pressed="true"] .dot{background:var(--accent);box-shadow:0 0 7px var(--accent)}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.26);
       flex:none;transition:background .18s,box-shadow .18s}
  .sep{width:1px;height:24px;flex:none;background:rgba(255,255,255,.12);margin:0 2px}

  /* ---------- 提示 ---------- */
  #hint{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
    font-size:12px;color:rgba(190,205,232,.62);letter-spacing:.4px;
    pointer-events:none;white-space:nowrap;
    transition:opacity .45s ease;z-index:5;
  }
  #hint.gone{opacity:0}

  /* ---------- 星球标注 ---------- */
  .poi{position:absolute;top:0;left:0;width:0;height:0;will-change:transform,opacity;opacity:0}
  .poi-name{
    position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    white-space:nowrap;text-align:center;
    font-size:11px;letter-spacing:.08em;color:#eaf2ff;
    text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.95);
    display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .poi-name b{font-weight:600;letter-spacing:.12em}
  .poi-name em{font-style:normal;font-size:8.5px;letter-spacing:.08em;color:#b9cbe6;opacity:.8}
  .poi.sun .poi-name b{color:#ffd98a}

  /* ---------- 加载 ---------- */
  #loading{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(120% 90% at 50% 42%,#0a1526 0%,#03060d 70%);
    z-index:20;transition:opacity .75s ease;
  }
  #loading.done{opacity:0;pointer-events:none}
  .ring{width:52px;height:52px;position:relative}
  .ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
  .ring::before{border-top-color:var(--accent);border-right-color:rgba(87,182,255,.35);animation:spin 1.05s linear infinite}
  .ring::after{inset:9px;border-bottom-color:rgba(140,200,255,.5);animation:spin 1.5s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .txt{font-size:13px;color:var(--ink-dim);letter-spacing:1px}
  #bar{width:190px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
  #bar i{display:block;height:100%;width:0%;border-radius:2px;
         background:linear-gradient(90deg,#2b7fd4,#7cc6ff);transition:width .3s ease}
  #err{
    position:fixed;inset:0;display:none;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;padding:32px;text-align:center;
    background:#03060d;z-index:30;font-size:14px;color:#ffb4b4;
  }
  #err code{font-size:12px;color:var(--ink-dim);max-width:640px;word-break:break-word;line-height:1.7}

  /* ---------- 移动端 ---------- */
  @media (max-width: 860px){
    #title{left:12px;top:12px;padding:10px 14px}
    #title h1{font-size:15px}
    #title p{font-size:11px}
    #toolbar{
      left:8px;right:8px;width:auto;max-width:none;transform:none;
      bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
      flex-wrap:wrap;justify-content:center;
      padding:5px;gap:3px;
    }
    #toolbar.on{transform:none}
    .pills{
      order:-1;width:100%;justify-content:flex-start;
      padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom:2px;
    }
    .pill{padding:8px 9px;font-size:11.5px}
    .sep{display:none}
    .btn{padding:8px 9px;font-size:12px}
    .btn .lbl{display:none}
    .btn svg{width:16px;height:16px}
    #hint{
      bottom:calc(env(safe-area-inset-bottom, 0px) + 112px);
      font-size:11px;letter-spacing:.08em;max-width:92vw;
      overflow:hidden;text-overflow:ellipsis;
    }
    .poi-name{font-size:10px}
    .poi-name em{display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header id="title" class="glass">
  <h1 id="t-title">太阳系</h1>
  <p id="t-sub">点击星球或下方名称切换视角 · 滚轮缩放</p>
</header>

<div id="hint">真实比例下太阳系空旷得看不到行星，此处的距离与大小已压缩</div>

<nav id="toolbar" class="glass">
  <div class="pills" id="pills"></div>
  <span class="sep"></span>
  <button class="btn" id="b-spin" aria-pressed="true" title="行星自转">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    <span class="lbl">自转</span><span class="dot"></span>
  </button>
  <button class="btn" id="b-orbit" aria-pressed="true" title="公转">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="20" cy="10.5" r="1.3"/></svg>
    <span class="lbl">公转</span><span class="dot"></span>
  </button>
  <button class="btn" id="b-path" aria-pressed="true" title="轨道线">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="2.4 3.2"/><circle cx="12" cy="12" r="2"/></svg>
    <span class="lbl">轨道</span><span class="dot"></span>
  </button>
  <button class="btn" id="b-label" aria-pressed="true" title="星球名称">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h13"/></svg>
    <span class="lbl">名称</span><span class="dot"></span>
  </button>
  <span class="sep"></span>
  <button class="btn" id="b-reset" title="回到全景">
    <svg viewBox="0 0 24 24"><path d="M12 3v3"/><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.4"/></svg>
    <span class="lbl">全景</span>
  </button>
  <button class="btn" id="b-full" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 15v5h-5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/></svg>
    <span class="lbl">全屏</span>
  </button>
</nav>

<div id="loading">
  <div class="ring"></div>
  <div class="txt" id="ltxt">正在装配太阳系…</div>
  <div id="bar"><i id="barfill"></i></div>
</div>

<div id="err">
  <div>无法启动 3D 渲染</div>
  <code id="errmsg"></code>
</div>

<script src="three.min.js"></script>
<script src="planet-assets.js"></script>
<script>
"use strict";
(function () {

/* ══════════════════════════════════════════════════════════════
   0. 工具
   ══════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const PORTRAIT = window.innerWidth / window.innerHeight < 0.8;

function fatal(msg) {
  $("loading").classList.add("done");
  $("errmsg").textContent = msg;
  $("err").style.display = "flex";
  console.error(msg);
}

/* ══════════════════════════════════════════════════════════════
   1. 太阳系数据（距离与大小做视觉压缩，数据本身为真实值）
   ══════════════════════════════════════════════════════════════ */
const SUN_R = 2.6;

const PLANETS = [
  { key:'mercury', name:'水星', en:'Mercury', a:0.387, period:88,     rKm:2440,  rotH:1407.6, ring:false, dia:'4,879 km',   year:'88 天',    day:'58.6 天' },
  { key:'venus',   name:'金星', en:'Venus',   a:0.723, period:224.7,  rKm:6052,  rotH:-5832,  ring:false, dia:'12,104 km',  year:'224.7 天', day:'243 天' },
  { key:'earth',   name:'地球', en:'Earth',   a:1.000, period:365.2,  rKm:6371,  rotH:23.9,   ring:false, dia:'12,742 km',  year:'365.2 天', day:'23.9 小时' },
  { key:'mars',    name:'火星', en:'Mars',    a:1.524, period:687,    rKm:3390,  rotH:24.6,   ring:false, dia:'6,779 km',   year:'687 天',   day:'24.6 小时' },
  { key:'jupiter', name:'木星', en:'Jupiter', a:5.203, period:4331,   rKm:69911, rotH:9.9,    ring:false, dia:'139,820 km', year:'11.86 年', day:'9.9 小时' },
  { key:'saturn',  name:'土星', en:'Saturn',  a:9.537, period:10747,  rKm:58232, rotH:10.7,   ring:true,  dia:'116,460 km', year:'29.45 年', day:'10.7 小时' },
  { key:'uranus',  name:'天王星', en:'Uranus', a:19.19, period:30589, rKm:25362, rotH:-17.2,  ring:false, dia:'50,724 km',  year:'84.0 年',  day:'17.2 小时' },
  { key:'neptune', name:'海王星', en:'Neptune', a:30.07, period:59800, rKm:24622, rotH:16.1,  ring:false, dia:'49,244 km',  year:'164.8 年', day:'16.1 小时' }
];

/* 视觉化：半径按 (r/r地球)^0.35，轨道按 a^0.62 */
const R_BASE = 0.62;
PLANETS.forEach((p) => {
  p.radius = R_BASE * Math.pow(p.rKm / 6371, 0.35);
  p.orbit = 4.0 + 4.6 * Math.pow(p.a, 0.62);
  p.angle = Math.random() * Math.PI * 2;
  p.orbitSpeed = (Math.PI * 2) / (45 * Math.sqrt(p.a));
  p.spinSpeed = Math.sign(p.rotH) * Math.pow(24 / Math.abs(p.rotH), 0.5) * 0.32;
});

const FOCUS = { overview: 'overview', sun: 'sun' };
const INFO = {
  overview: { title:'太阳系', sub:'点击星球或下方名称切换视角 · 滚轮缩放' },
  sun: { title:'太阳', sub:'直径 1,392,700 km · 占太阳系 99.86% 的质量' }
};
PLANETS.forEach((p) => {
  INFO[p.key] = { title: p.name, sub: '直径 ' + p.dia + ' · 距日 ' + p.a.toFixed(2) + ' AU · 公转 ' + p.year };
});

/* ══════════════════════════════════════════════════════════════
   2. 启动
   ══════════════════════════════════════════════════════════════ */
function boot() {
  const canvas = $("gl");
  if (!window.THREE) { fatal("three.js 未能加载"); return; }
  if (!window.PLANET_ASSETS) { fatal("行星贴图数据缺失"); return; }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
  } catch (e) { fatal("当前浏览器或显卡不支持 WebGL。请用较新版本的 Chrome / Edge 打开。"); return; }

  const PR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(PR);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x03060d, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.02, 8000);

  /* ---------- 相机状态 ---------- */
  const state = {
    spin: true,
    orbit: true,
    path: true,
    label: true,
    focus: 'overview',
    theta: 0.55, phi: 1.02,
    tTheta: 0.55, tPhi: 1.02,
    radius: PORTRAIT ? 150 : 108,
    tRadius: PORTRAIT ? 150 : 108,
    target: new THREE.Vector3(0, 0, 0),
    tTarget: new THREE.Vector3(0, 0, 0),
    vTheta: 0, vPhi: 0,
    dragging: false,
    lastX: 0, lastY: 0,
    moved: false,
    pinch: 0,
    followLight: false,
    time: 0
  };

  const VIEW = {
    overview: { radius: PORTRAIT ? 150 : 108 },
    sun: { radius: 10 },
    planet: (p) => {
      const base = PORTRAIT ? 7.4 : 4.6;
      const k = p.ring ? (PORTRAIT ? 2.0 : 1.8) : 1;
      return Math.max(0.9, p.radius * base * k);
    }
  };

  /* ---------- 星空 ---------- */
  const starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: PR } },
    vertexShader: [
      "attribute float aSize;",
      "attribute float aPhase;",
      "attribute vec3 aColor;",
      "uniform float uTime;",
      "uniform float uPixelRatio;",
      "varying vec3 vColor;",
      "varying float vTwinkle;",
      "void main(){",
      "  vColor = aColor;",
      "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
      "  gl_PointSize = aSize * uPixelRatio * (330.0 / max(1.0, -mv.z));",
      "  gl_Position = projectionMatrix * mv;",
      "  vTwinkle = 0.74 + 0.26 * sin(uTime * 0.9 + aPhase);",
      "}"
    ].join("\n"),
    fragmentShader: [
      "varying vec3 vColor;",
      "varying float vTwinkle;",
      "void main(){",
      "  vec2 d = gl_PointCoord - 0.5;",
      "  float r = length(d);",
      "  float a = smoothstep(0.5, 0.02, r);",
      "  a = pow(a, 1.8);",
      "  gl_FragColor = vec4(vColor * vTwinkle, a);",
      "}"
    ].join("\n"),
    transparent: true, depthWrite: false, depthTest: true,
    blending: THREE.AdditiveBlending
  });

  (function buildStars() {
    function geo(count, opts) {
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const size = new Float32Array(count);
      const phase = new Float32Array(count);
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(1.02, 0.5, 0.2));
      const v = new THREE.Vector3();
      for (let i = 0; i < count; i++) {
        if (opts.band) {
          const a = Math.random() * Math.PI * 2;
          const g = (Math.random() + Math.random() + Math.random() - 1.5) * 0.22;
          v.set(Math.cos(a), g, Math.sin(a)).normalize().applyQuaternion(q);
        } else {
          const u = Math.random() * 2 - 1;
          const th = Math.random() * Math.PI * 2;
          const s = Math.sqrt(1 - u * u);
          v.set(s * Math.cos(th), u, s * Math.sin(th));
        }
        const r = opts.rMin + Math.random() * (opts.rMax - opts.rMin);
        pos[i * 3] = v.x * r; pos[i * 3 + 1] = v.y * r; pos[i * 3 + 2] = v.z * r;
        const t = Math.random();
        let cr, cg, cb;
        if (t < 0.14) { cr = 1.0; cg = 0.86; cb = 0.70; }
        else if (t < 0.34) { cr = 0.76; cg = 0.86; cb = 1.0; }
        else { cr = 1.0; cg = 0.98; cb = 0.95; }
        const lum = opts.lum * (0.45 + Math.random() * 0.75);
        col[i * 3] = cr * lum; col[i * 3 + 1] = cg * lum; col[i * 3 + 2] = cb * lum;
        size[i] = opts.size * (0.45 + Math.pow(Math.random(), 2.6) * 1.9);
        phase[i] = Math.random() * Math.PI * 2;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
      g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
      g.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
      return g;
    }
    const s1 = new THREE.Points(geo(3400, { rMin: 400, rMax: 1600, lum: 1.0, size: 1.1 }), starMat);
    s1.frustumCulled = false; scene.add(s1);
    const s2 = new THREE.Points(geo(4600, { band: true, rMin: 600, rMax: 2200, lum: 0.58, size: 0.85 }), starMat);
    s2.frustumCulled = false; scene.add(s2);
  })();

  /* ---------- 光照 ---------- */
  const sunLight = new THREE.PointLight(0xfff6e8, 2.55, 0, 0);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x1b2438, 0.22));

  /* ---------- 贴图 ---------- */
  let loaded = 0;
  const TOTAL = 9;
  const barfill = $("barfill");
  function loadTex(url, srgb) {
    return new Promise((resolve, reject) => {
      new THREE.TextureLoader().load(url, (tex) => {
        if (srgb) tex.encoding = THREE.sRGBEncoding;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.generateMipmaps = true;
        loaded++;
        barfill.style.width = Math.round(20 + (loaded / TOTAL) * 72) + "%";
        resolve(tex);
      }, undefined, reject);
    });
  }

  /* ---------- 太阳（程序化表面） ---------- */
  const sunVS = [
    "varying vec3 vN; varying vec3 vW; varying vec2 vUv;",
    "void main(){",
    "  vec4 wp = modelMatrix * vec4(position, 1.0);",
    "  vW = wp.xyz;",
    "  vN = normalize(mat3(modelMatrix) * normal);",
    "  vUv = uv;",
    "  gl_Position = projectionMatrix * viewMatrix * wp;",
    "}"
  ].join("\n");

  const sunFS = [
    "varying vec3 vN; varying vec3 vW; varying vec2 vUv;",
    "uniform float uTime;",
    "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }",
    "float noise(vec2 p){",
    "  vec2 i = floor(p), f = fract(p);",
    "  vec2 u = f*f*(3.0-2.0*f);",
    "  return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x),",
    "             mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);",
    "}",
    "float fbm(vec2 p){",
    "  float v = 0.0, a = 0.5;",
    "  for(int i=0;i<5;i++){ v += a*noise(p); p *= 2.03; a *= 0.5; }",
    "  return v;",
    "}",
    "void main(){",
    "  vec2 uv = vUv * vec2(9.0, 4.5);",
    "  float n1 = fbm(uv + vec2(uTime*0.03, uTime*0.012));",
    "  float n2 = fbm(uv*2.7 - vec2(uTime*0.05, 0.0));",
    "  float t = n1*0.62 + n2*0.38;",
    "  vec3 c1 = vec3(0.95, 0.40, 0.07);",
    "  vec3 c2 = vec3(1.0, 0.88, 0.52);",
    "  vec3 c3 = vec3(1.0, 1.0, 0.94);",
    "  vec3 col = mix(c1, c2, smoothstep(0.30, 0.70, t));",
    "  col = mix(col, c3, smoothstep(0.68, 0.94, t) * 0.55);",
    "  vec3 N = normalize(vN);",
    "  vec3 V = normalize(cameraPosition - vW);",
    "  float lim = 1.0 - abs(dot(N, V));",
    "  col *= 1.0 - pow(lim, 2.4) * 0.5;",
    "  gl_FragColor = vec4(col * 1.22, 1.0);",
    "}"
  ].join("\n");

  const sunUniforms = { uTime: { value: 0 } };
  const sunMat = new THREE.ShaderMaterial({
    uniforms: sunUniforms, vertexShader: sunVS, fragmentShader: sunFS
  });
  const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 96, 48), sunMat);
  scene.add(sun);

  /* ---------- 行星 ---------- */
  const planetObjects = [];
  const orbitLines = [];
  const pickables = [];
  const MOON_TILT = 0.47; // 土星环倾斜

  function ringTexture(tex) {
    // 环纹理是竖条（v = 半径），改用极坐标 UV
    const geo = new THREE.RingGeometry(1.28, 2.32, 160, 1);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const r = Math.hypot(v.x, v.y);
      const t = (r - 1.28) / (2.32 - 1.28);
      uv.setXY(i, 0.5, t);
    }
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, side: THREE.DoubleSide,
      depthWrite: false, opacity: 0.96
    });
    return new THREE.Mesh(geo, mat);
  }

  function build(earthDay) {
    PLANETS.forEach((p) => {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        map: textures[p.key],
        roughness: 0.92,
        metalness: 0.0
      });
      const BRIGHT = { mercury:1.0, venus:0.98, earth:1.16, mars:1.0, jupiter:0.9, saturn:0.72, uranus:0.95, neptune:1.0 };
      mat.color.setScalar(BRIGHT[p.key] || 1.0);
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 64, 32), mat);
      mesh.userData.key = p.key;
      group.add(mesh);

      if (p.ring) {
        const ring = ringTexture(textures.ring);
        ring.scale.setScalar(p.radius);
        ring.rotation.x = -Math.PI / 2;
        group.add(ring);
        group.rotation.z = MOON_TILT;
      }

      // 公转轨道线
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * p.orbit, 0, Math.sin(a) * p.orbit));
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
        color: 0x6f8fbf, transparent: true, opacity: 0.16, depthWrite: false
      }));
      scene.add(line);
      orbitLines.push(line);

      scene.add(group);
      p.group = group;
      p.mesh = mesh;
      p.baseTilt = p.key === 'saturn' ? 0 : 0.18;
      planetObjects.push(p);
      pickables.push(mesh);
    });

    // 地球贴图在 assets 里叫 earth，其余为 key 同名
    sun.userData.key = 'sun';
    pickables.push(sun);

    buildLabels();
    updateTitle('overview');

    barfill.style.width = "100%";
    $("ltxt").textContent = "完成";
    setTimeout(() => {
      $("loading").classList.add("done");
      $("title").classList.add("on");
      $("toolbar").classList.add("on");
      if (PORTRAIT) focusOn('earth', true);
    }, 160);

    state.ready = true;
    lastT = performance.now();
    requestAnimationFrame(frame);
  }

  let textures = {};
  Promise.all([
    loadTex(window.PLANET_ASSETS.mercury, true),
    loadTex(window.PLANET_ASSETS.venus, true),
    loadTex(window.PLANET_ASSETS.earth, true),
    loadTex(window.PLANET_ASSETS.mars, true),
    loadTex(window.PLANET_ASSETS.jupiter, true),
    loadTex(window.PLANET_ASSETS.saturn, true),
    loadTex(window.PLANET_ASSETS.ring, false),
    loadTex(window.PLANET_ASSETS.uranus, true),
    loadTex(window.PLANET_ASSETS.neptune, true)
  ]).then((t) => {
    textures = {
      mercury: t[0], venus: t[1], earth: t[2], mars: t[3],
      jupiter: t[4], saturn: t[5], ring: t[6], uranus: t[7], neptune: t[8]
    };
    build(t[2]);
  }).catch((e) => {
    fatal("贴图加载失败：" + (e && e.message ? e.message : e));
  });

  /* ---------- 标注 ---------- */
  const labelLayer = $("labels");
  const labelItems = [];

  function buildLabels() {
    const items = [{ key: 'sun', name: '太阳', en: 'Sun' }].concat(PLANETS.map((p) => ({ key: p.key, name: p.name, en: p.en })));
    items.forEach((it) => {
      const el = document.createElement('div');
      el.className = 'poi' + (it.key === 'sun' ? ' sun' : '');
      const nm = document.createElement('span');
      nm.className = 'poi-name';
      const b = document.createElement('b');
      b.textContent = it.name;
      const em = document.createElement('em');
      em.textContent = it.en;
      nm.appendChild(b); nm.appendChild(em);
      el.appendChild(nm);
      labelLayer.appendChild(el);
      labelItems.push({ el, key: it.key });
    });
  }

  const _v = new THREE.Vector3();

  function updateLabels() {
    if (!labelItems.length) return;
    if (!state.label) {
      labelItems.forEach((it) => { it.el.style.opacity = '0'; });
      return;
    }
    const w = window.innerWidth, h = window.innerHeight;
    const placed = [];

    // 太阳的屏幕位置：标签沿"太阳 → 行星"方向向外散开，避免内圈挤成一团
    _v.set(0, 0, 0).project(camera);
    const sx = (_v.x * 0.5 + 0.5) * w;
    const sy = (-_v.y * 0.5 + 0.5) * h;

    const narrow = window.innerWidth < 720;
    labelItems.forEach((it) => {
      if (narrow && state.focus === 'overview' && (it.key === 'mercury' || it.key === 'venus' || it.key === 'earth' || it.key === 'mars')) {
        it.el.style.opacity = '0';
        return;
      }
      let ox = 0, oy = 0;
      if (it.key === 'sun') { _v.set(0, SUN_R * 1.2, 0); oy = -18; }
      else {
        const p = planetObjects.find((x) => x.key === it.key);
        if (!p) return;
        _v.set(p.group.position.x, p.radius * 1.15, p.group.position.z);
      }
      const dist = camera.position.distanceTo(_v);
      const ndc = _v.clone().project(camera);
      if (ndc.z > 1) { it.el.style.opacity = '0'; return; }
      const x = (ndc.x * 0.5 + 0.5) * w;
      const y = (-ndc.y * 0.5 + 0.5) * h;
      if (x < -80 || x > w + 80 || y < -40 || y > h + 40) { it.el.style.opacity = '0'; return; }

      if (it.key !== 'sun') {
        const dx = x - sx, dy = y - sy;
        const len = Math.hypot(dx, dy) || 1;
        ox = (dx / len) * 20;
        oy = (dy / len) * 20 - 8;
      }

      let alpha = clamp(1 - (dist - 6) / (state.focus === 'overview' ? 220 : 60), 0.25, 1);
      if (state.focus === 'overview') alpha = Math.min(alpha, 0.85);

      const px = x + ox;
      let ty = y + oy;
      for (let pass = 0; pass < 4; pass++) {
        let hit = false;
        for (let j = 0; j < placed.length; j++) {
          const q = placed[j];
          if (Math.abs(px - q.x) < 64 && Math.abs(ty - q.y) < 18) { ty = q.y + 18; hit = true; }
        }
        if (!hit) break;
      }
      placed.push({ x: px, y: ty });

      it.el.style.transform = "translate3d(" + px.toFixed(1) + "px," + ty.toFixed(1) + "px,0)";
      it.el.style.opacity = alpha.toFixed(3);
    });
  }

  /* ---------- 焦点 ---------- */
  const pills = $("pills");
  const pillEls = {};

  function buildPills() {
    const list = [{ key: 'overview', name: '全景' }, { key: 'sun', name: '太阳' }]
      .concat(PLANETS.map((p) => ({ key: p.key, name: p.name })));
    list.forEach((it) => {
      const b = document.createElement('button');
      b.className = 'pill';
      b.textContent = it.name;
      b.dataset.key = it.key;
      b.addEventListener('click', () => { focusOn(it.key); hideHint(); });
      pills.appendChild(b);
      pillEls[it.key] = b;
    });
  }

  function updateTitle(key) {
    const info = INFO[key] || INFO.overview;
    $("t-title").textContent = info.title;
    $("t-sub").textContent = info.sub;
  }

  function focusOn(key, instant) {
    state.focus = key;
    let radius;
    if (key === 'overview') {
      state.tTarget.set(0, 0, 0);
      radius = VIEW.overview.radius;
    } else if (key === 'sun') {
      state.tTarget.set(0, 0, 0);
      radius = VIEW.sun.radius;
    } else {
      const p = planetObjects.find((x) => x.key === key);
      if (!p) return;
      state.tTarget.copy(p.group.position);
      radius = VIEW.planet(p);

      state.followLight = true;
      /* 自动转到被太阳照亮的一侧，避免聚焦后看到全黑的夜面 */
      const ang = Math.atan2(-p.group.position.x, -p.group.position.z);
      let dAng = ((ang - state.tTheta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      state.tTheta = state.tTheta + dAng;
      state.tPhi = p.ring ? 1.02 : 1.24;
      if (instant) { state.theta = state.tTheta; state.phi = state.tPhi; }
    }
    state.tRadius = radius;
    if (instant) {
      state.target.copy(state.tTarget);
      state.radius = radius;
      state.theta = state.tTheta;
      state.phi = state.tPhi;
    }
    Object.keys(pillEls).forEach((k) => pillEls[k].classList.toggle('active', k === key));
    updateTitle(key);
  }

  /* ---------- 交互 ---------- */
  const SENS = 0.0052;

  function down(x, y) {
    state.dragging = true; state.moved = false;
    state.followLight = false;
    state.lastX = x; state.lastY = y;
    state.vTheta = state.vPhi = 0;
    canvas.classList.add('dragging');
    hideHint();
  }
  function move(x, y) {
    if (!state.dragging) return;
    const dx = x - state.lastX, dy = y - state.lastY;
    state.lastX = x; state.lastY = y;
    if (Math.abs(dx) + Math.abs(dy) > 1) state.moved = true;
    state.vTheta = -dx * SENS * 0.5;
    state.vPhi = -dy * SENS * 0.5;
    state.tTheta -= dx * SENS;
    state.tPhi = clamp(state.tPhi - dy * SENS, 0.08, Math.PI - 0.08);
  }
  function up() {
    state.dragging = false;
    canvas.classList.remove('dragging');
  }

  const active = new Map();

  function onDown(e) {
    active.set(e.pointerId, [e.clientX, e.clientY]);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    if (active.size === 1) down(e.clientX, e.clientY);
    else { state.dragging = false; canvas.classList.remove('dragging'); state.pinch = 0; }
  }
  function onMove(e) {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, [e.clientX, e.clientY]);
    if (active.size === 1) move(e.clientX, e.clientY);
    else if (active.size >= 2) {
      const [a, b] = [...active.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (state.pinch > 0 && d > 0) state.tRadius = clamp(state.tRadius * (state.pinch / d), 0.4, 700);
      state.pinch = d;
      hideHint();
    }
  }
  function onUp(e) {
    active.delete(e.pointerId);
    if (active.size === 0) { state.pinch = 0; up(); }
    else if (active.size === 1) {
      state.pinch = 0;
      const [x, y] = [...active.values()][0];
      down(x, y);
    }
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('lostpointercapture', onUp);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 100 : e.deltaY;
    state.tRadius = clamp(state.tRadius * Math.exp(clamp(d, -160, 160) * 0.0013), 0.4, 700);
    hideHint();
  }, { passive: false });

  /* 点击星球 */
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downAt = 0;
  canvas.addEventListener('pointerdown', () => { downAt = performance.now(); });
  canvas.addEventListener('click', (e) => {
    if (performance.now() - downAt > 320 || state.moved) return;
    if (!state.ready) return;
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    if (!hits.length) return;
    const key = hits[0].object.userData.key;
    if (key) { focusOn(key); flashHint(key === 'sun' ? '已聚焦太阳' : '已聚焦' + INFO[key].title); }
  });

  canvas.addEventListener('dblclick', () => resetView());

  function resetView() {
    focusOn('overview');
    state.tTheta = 0.55; state.tPhi = 1.02;
    state.vTheta = state.vPhi = 0;
    hideHint();
  }

  /* 键盘 */
  window.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (e.key === ' ') { e.preventDefault(); $('b-spin').click(); }
    else if (k === 'r') resetView();
    else if (k === 'f') $('b-full').click();
    else if (isFinite(parseInt(e.key, 10))) {
      const n = parseInt(e.key, 10);
      if (n === 0) focusOn('overview');
      else if (n === 1) focusOn('mercury');
      else if (n === 2) focusOn('venus');
      else if (n === 3) focusOn('earth');
      else if (n === 4) focusOn('mars');
      else if (n === 5) focusOn('jupiter');
      else if (n === 6) focusOn('saturn');
      else if (n === 7) focusOn('uranus');
      else if (n === 8) focusOn('neptune');
      else if (n === 9) focusOn('sun');
    } else if (e.key === 'ArrowLeft') state.tTheta += 0.09;
    else if (e.key === 'ArrowRight') state.tTheta -= 0.09;
    else if (e.key === 'ArrowUp') state.tPhi = clamp(state.tPhi - 0.07, 0.08, Math.PI - 0.08);
    else if (e.key === 'ArrowDown') state.tPhi = clamp(state.tPhi + 0.07, 0.08, Math.PI - 0.08);
    else if (e.key === '+' || e.key === '=') state.tRadius = clamp(state.tRadius * 0.86, 0.4, 700);
    else if (e.key === '-' || e.key === '_') state.tRadius = clamp(state.tRadius / 0.86, 0.4, 700);
  });

  /* ---------- 工具栏 ---------- */
  function toggle(btn, key, onChange) {
    btn.addEventListener('click', () => {
      state[key] = !state[key];
      btn.setAttribute('aria-pressed', String(state[key]));
      if (onChange) onChange(state[key]);
      hideHint();
    });
  }

  toggle($('b-spin'), 'spin');
  toggle($('b-orbit'), 'orbit');
  toggle($('b-path'), 'path', (on) => { orbitLines.forEach((l) => { l.visible = on; }); });
  toggle($('b-label'), 'label', (on) => {
    if (!on) labelItems.forEach((it) => { it.el.style.opacity = '0'; });
  });

  $('b-reset').addEventListener('click', resetView);

  $('b-full').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function () {}).call(document.documentElement).catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    $('b-full').setAttribute('aria-pressed', String(!!document.fullscreenElement));
    setTimeout(resize, 60);
  });

  /* 提示 */
  const hintEl = $('hint');
  let hintTimer = setTimeout(() => hintEl.classList.add('gone'), 6500);
  function hideHint() { clearTimeout(hintTimer); hintEl.classList.add('gone'); }
  function flashHint(text) {
    clearTimeout(hintTimer);
    hintEl.textContent = text;
    hintEl.classList.remove('gone');
    hintTimer = setTimeout(() => hintEl.classList.add('gone'), 1900);
  }

  /* ---------- 主循环 ---------- */
  let lastT = 0, running = true;

  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);

    let dt = (now - lastT) / 1000;
    lastT = now;
    if (!(dt > 0)) dt = 0.016;
    if (dt > 0.1) dt = 0.1;
    state.time += dt;
    sunUniforms.uTime.value = state.time;

    /* 公转 */
    if (state.orbit) {
      PLANETS.forEach((p) => { p.angle += p.orbitSpeed * dt; });
    }
    /* 自转 */
    if (state.spin) {
      PLANETS.forEach((p) => { p.mesh.rotation.y += p.spinSpeed * dt; });
      sun.rotation.y += 0.03 * dt;
    }

    /* 行星位置 */
    PLANETS.forEach((p) => {
      p.group.position.set(
        Math.cos(p.angle) * p.orbit,
        0,
        Math.sin(p.angle) * p.orbit
      );
      if (p.ring) p.group.rotation.y = 0;
    });

    /* 相机阻尼 + 惯性 */
    if (!state.dragging) {
      if (Math.abs(state.vTheta) > 1e-5 || Math.abs(state.vPhi) > 1e-5) {
        state.tTheta += state.vTheta;
        state.tPhi = clamp(state.tPhi + state.vPhi, 0.08, Math.PI - 0.08);
        state.vTheta *= Math.pow(0.94, dt * 60);
        state.vPhi *= Math.pow(0.94, dt * 60);
      } else { state.vTheta = state.vPhi = 0; }
    }
    state.tPhi = clamp(state.tPhi, 0.08, Math.PI - 0.08);

    const k = 1 - Math.pow(0.0016, dt);
    state.theta = lerp(state.theta, state.tTheta, k);
    state.phi = lerp(state.phi, state.tPhi, k);

    /* 焦点跟随行星 */
    if (state.focus !== 'overview' && state.focus !== 'sun') {
      const p = planetObjects.find((x) => x.key === state.focus);
      if (p) {
        state.tTarget.copy(p.group.position);
        if (state.followLight) {
          const ang = Math.atan2(-p.group.position.x, -p.group.position.z);
          const d = ((ang - state.tTheta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          state.tTheta += d * Math.min(1, dt * 5);
        }
      }
    }
    state.target.lerp(state.tTarget, k);
    state.radius = lerp(state.radius, state.tRadius, k);

    const sp = Math.sin(state.phi), cp = Math.cos(state.phi);
    camera.position.set(
      state.target.x + state.radius * sp * Math.sin(state.theta),
      state.target.y + state.radius * cp,
      state.target.z + state.radius * sp * Math.cos(state.theta)
    );
    camera.lookAt(state.target);

    if (starMat) starMat.uniforms.uTime.value = state.time;
    if (state.ready) updateLabels();
    renderer.render(scene, camera);
  }

  /* ---------- 尺寸 ---------- */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; }
    else if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(frame); }
  });

  buildPills();
  setTimeout(() => { barfill.style.width = '16%'; }, 80);

  window.__solar = { state, camera, scene, focusOn, PLANETS, sun };
}

boot();
})();
</script>
</body>
</html>
